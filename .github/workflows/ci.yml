name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Only the allowlisted files are packed
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json"))[0].files.map(f => f.path);
            const bad = files.filter(f => !/^(src\/|index\.d\.ts$|README\.md$|LICENSE$|package\.json$)/.test(f));
            console.log(files.join("\n"));
            if (bad.length) { console.error("unexpected files in package:", bad); process.exit(1); }
          '
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
